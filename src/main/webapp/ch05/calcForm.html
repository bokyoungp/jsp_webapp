<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <title>계산기 - 컨트롤러</title>
</head>
<body>
    <h1>계산기 - 컨트롤러</h1>
    <hr>
    <form action="/calcControl" method="post">
        <input type="text" name="num1">
        <select name="op">
            <option value="+">+</option>
            <option value="-">-</option>
            <option value="*">*</option>
            <option value="/">/</option>
        </select>
        <input type="text" name="num2">
        <input type="submit" value="계산">
    </form>
</body>
</html>
